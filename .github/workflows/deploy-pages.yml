name: Deploy MyTMS Candidate TEST

on:
  push:
    branches: [main]
    paths:
      - candidate-site.zip
      - .github/workflows/deploy-pages.yml
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out deployment repository
        uses: actions/checkout@v6
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Expand the sealed Candidate site
        run: |
          mkdir -p _site
          unzip -q candidate-site.zip -d _site
          test -f _site/index.html
          test -f _site/CNAME
          test -f _site/.nojekyll
          test -f _site/.well-known/assetlinks.json
          test ! -e _site/.env
          test ! -e _site/.env.local
      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site
          include-hidden-files: true
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
